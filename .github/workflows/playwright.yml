name: Playwright E2E

on:
  push:
  pull_request:
  schedule:
    - cron: '0 4 * * *'   # 06:00 Egypt (UTC+2) → 04:00 UTC
  workflow_dispatch:

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  E2E_VALID_USERNAME: standard_user
  E2E_VALID_PASSWORD: secret_sauce
  E2E_INVALID_USERNAME: not_a_real_user
  E2E_INVALID_PASSWORD: wrong_password
  E2E_CHECKOUT_FIRST_NAME: Test
  E2E_CHECKOUT_LAST_NAME: User
  E2E_CHECKOUT_POSTAL_CODE: '12345'

jobs:
  Chrome_Linux_Test:
    name: Chrome · Linux
    timeout-minutes: 60
    runs-on: ubuntu-latest
    outputs:
      test_result: ${{ steps.run_tests.outcome }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chrome
        run: npx playwright install chrome --with-deps

      - name: Run tests on Chrome
        continue-on-error: true
        id: run_tests
        run: npx playwright test --project=Chrome

      - name: Upload Chrome report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: report-chrome-linux-${{ github.run_id }}
          path: playwright-report/
          retention-days: 14

  Edge_Windows_Test:
    name: Edge · Windows
    timeout-minutes: 60
    runs-on: windows-latest
    outputs:
      test_result: ${{ steps.run_tests.outcome }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Edge
        run: npx playwright install msedge --with-deps

      - name: Run tests on Edge
        continue-on-error: true
        id: run_tests
        run: npx playwright test --project=Edge

      - name: Upload Edge report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: report-edge-windows-${{ github.run_id }}
          path: playwright-report/
          retention-days: 14

  notify:
    name: Notify
    needs: [Chrome_Linux_Test, Edge_Windows_Test]
    if: ${{ always() }}
    runs-on: ubuntu-latest

    steps:
      - name: Build summary
        id: summary
        run: |
          CHROME="${{ needs.Chrome_Linux_Test.outputs.test_result }}"
          EDGE="${{ needs.Edge_Windows_Test.outputs.test_result }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [ "$CHROME" = "success" ]; then
            CHROME_LINE="Chrome on Linux  : PASSED"
          else
            CHROME_LINE="Chrome on Linux  : FAILED"
          fi

          if [ "$EDGE" = "success" ]; then
            EDGE_LINE="Edge on Windows  : PASSED"
          else
            EDGE_LINE="Edge on Windows  : FAILED"
          fi

          if [ "$CHROME" = "success" ] && [ "$EDGE" = "success" ]; then
            SUBJECT="Playwright Run Report - All tests passed"
            STATUS_LINE="Overall Status: All tests passed successfully."
          else
            SUBJECT="Playwright Run Report - FAILURE: Some tests failed, action required"
            STATUS_LINE="Overall Status: FAILURE - One or more tests failed in this run. Please review the report immediately."
          fi

          echo "subject=${SUBJECT}" >> $GITHUB_OUTPUT
          echo "chrome_line=${CHROME_LINE}" >> $GITHUB_OUTPUT
          echo "edge_line=${EDGE_LINE}" >> $GITHUB_OUTPUT
          echo "status_line=${STATUS_LINE}" >> $GITHUB_OUTPUT
          echo "run_url=${RUN_URL}" >> $GITHUB_OUTPUT

      - name: Send email notification
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          to: ${{ secrets.MAIL_TO }}
          from: SwagLab CI <${{ secrets.MAIL_USERNAME }}>
          subject: ${{ steps.summary.outputs.subject }}
          body: |
            Playwright E2E Test Run Report
            ================================
            Repository : ${{ github.repository }}
            Branch     : ${{ github.ref_name }}
            Trigger    : ${{ github.event_name }}
            Run ID     : ${{ github.run_id }}

            Test Results
            ------------
            ${{ steps.summary.outputs.chrome_line }}
            ${{ steps.summary.outputs.edge_line }}

            ${{ steps.summary.outputs.status_line }}

            Full Report: ${{ steps.summary.outputs.run_url }}
