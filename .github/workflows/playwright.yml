name: Playwright E2E

on:
  push:
  pull_request:
  schedule:
    - cron: '0 4 * * *'   # 06:00 Egypt (UTC+2) → 04:00 UTC
  workflow_dispatch:

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  E2E_VALID_USERNAME: standard_user
  E2E_VALID_PASSWORD: secret_sauce
  E2E_INVALID_USERNAME: not_a_real_user
  E2E_INVALID_PASSWORD: wrong_password
  E2E_CHECKOUT_FIRST_NAME: Test
  E2E_CHECKOUT_LAST_NAME: User
  E2E_CHECKOUT_POSTAL_CODE: '12345'

jobs:
  Chrome_Linux_Test:
    name: Chrome · Linux
    timeout-minutes: 60
    runs-on: ubuntu-latest
    outputs:
      test_result: ${{ steps.run_tests.outcome }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chrome
        run: npx playwright install chrome --with-deps

      - name: Run tests on Chrome
        continue-on-error: true
        id: run_tests
        run: npx playwright test --project=Chrome

      - name: Upload Chrome report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: report-chrome-linux-${{ github.run_id }}
          path: playwright-report/
          retention-days: 14

  Edge_Windows_Test:
    name: Edge · Windows
    timeout-minutes: 60
    runs-on: windows-latest
    outputs:
      test_result: ${{ steps.run_tests.outcome }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Edge
        run: npx playwright install msedge --with-deps

      - name: Run tests on Edge
        continue-on-error: true
        id: run_tests
        run: npx playwright test --project=Edge

      - name: Upload Edge report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: report-edge-windows-${{ github.run_id }}
          path: playwright-report/
          retention-days: 14

  notify:
    name: Notify
    needs: [Chrome_Linux_Test, Edge_Windows_Test]
    if: ${{ always() }}
    runs-on: ubuntu-latest

    steps:
      - name: Build summary
        id: summary
        run: |
          CHROME="${{ needs.Chrome_Linux_Test.outputs.test_result }}"
          EDGE="${{ needs.Edge_Windows_Test.outputs.test_result }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [ "$CHROME" = "success" ] && [ "$EDGE" = "success" ]; then
            echo "title=✅ Playwright – All tests PASSED (Chrome + Edge)" >> $GITHUB_OUTPUT
          else
            echo "title=❌ Playwright – Some tests FAILED | Chrome: $CHROME | Edge: $EDGE" >> $GITHUB_OUTPUT
          fi
          echo "body=Repo: ${{ github.repository }} | Branch: ${{ github.ref_name }} | Trigger: ${{ github.event_name }} | Chrome: $CHROME | Edge: $EDGE | Report: ${RUN_URL}" >> $GITHUB_OUTPUT

      - name: Send email notification
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          to: ${{ secrets.MAIL_TO }}
          from: SwagLab CI <${{ secrets.MAIL_USERNAME }}>
          subject: ${{ steps.summary.outputs.title }}
          body: |
            ${{ steps.summary.outputs.body }}

            View report: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
